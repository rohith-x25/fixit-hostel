apiVersion: v1
kind: Secret
metadata:
  name: fixit-secret
type: Opaque
stringData:
  JWT_SECRET: change-me-in-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixit-hostel
spec:
  replicas: 1   # SQLite is a single-file DB, so keep 1 replica (use PostgreSQL to scale out)
  selector:
    matchLabels:
      app: fixit-hostel
  template:
    metadata:
      labels:
        app: fixit-hostel
    spec:
      containers:
        - name: app
          image: fixit-hostel:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: fixit-secret
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fixit-hostel
spec:
  type: NodePort
  selector:
    app: fixit-hostel
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
