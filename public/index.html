<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FixIt Hostel</title>
<style>
:root{--b:#1f4e8c;--bg:#f4f7fb;--c:#fff;--t:#1d2733;--m:#6b7785}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--b);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:20px;margin:0 auto 0 0}header button{background:transparent;color:#fff;border:1px solid #ffffff88;padding:6px 12px;border-radius:6px;cursor:pointer;margin-left:6px}
main{max-width:980px;margin:20px auto;padding:0 14px}.card{background:var(--c);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0001;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat{text-align:center}.stat b{font-size:28px;display:block;color:var(--b)}
input,select,textarea{width:100%;padding:9px;margin:4px 0 10px;border:1px solid #c9d2dd;border-radius:6px;font:inherit}
button.p{background:var(--b);color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #e3e8ef;font-size:14px}tr.click{cursor:pointer}tr.click:hover{background:#eef3fa}
.badge{padding:2px 8px;border-radius:10px;background:#e3ecf8;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border-radius:6px;z-index:9}#msg:not(:empty){padding:10px 14px}
small{color:var(--m)}
</style></head><body>
<header><h1>🛠 FixIt Hostel</h1><nav id="nav"></nav></header>
<main id="app"></main><div id="msg"></div>
<script src="app.js"></script></body></html>
